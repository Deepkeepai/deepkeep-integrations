_format_version: "3.0"

plugins:
  - name: ai-custom-guardrail
    service: example-ai-service
    config:
      guarding_mode: INPUT
      text_source: concatenate_user_content
      allow_masking: true
      params:
        api_base: ${{ env "DECK_DEEPKEEP_API_BASE" }}
        api_key: ${{ env "DECK_DEEPKEEP_API_KEY" }}
        firewall_id: ${{ env "DECK_DEEPKEEP_INPUT_FIREWALL_ID" }}
        chat_id: ${{ env "DECK_DEEPKEEP_CHAT_ID" }}
        title: ${{ env "DECK_DEEPKEEP_TITLE" }}
      request:
        url: "$(conf.params.api_base)/api/v3/openai/moderations/pre"
        headers:
          X-API-Key: "$(conf.params.api_key)"
        body:
          model: "$(conf.params.firewall_id)"
          input: "$(content)"
          chat: "$(conf.params.chat_id)"
          title: "$(conf.params.title)"
      response:
        block: "$(deepkeep_check.block)"
        block_message: "$(deepkeep_check.block_message)"
      metrics:
        block_reason: "$(deepkeep_check.block_reason)"
        block_detail: "$(deepkeep_check.block_detail)"
        masked: "$(deepkeep_check.masked)"
      functions:
        deepkeep_check: |
          return function(resp)
            local result = {
              block = false,
              block_message = "DeepKeep allowed the request",
              masked = false,
              block_reason = "",
              block_detail = "",
            }

            if not resp or not resp.flagged then
              return result
            end

            local priority = {
              block = 4,
              redact = 3,
              modify = 2,
              alert = 1,
            }

            local best_action = "alert"
            local best_score = 1
            local best_name = "DeepKeep"
            local reasons = {}

            for _, item in ipairs(resp.verbosity or EMPTY_T) do
              local details = item.details or {}
              local action = tostring(details.guardrail_action or "alert")
              local score = priority[action] or 1

              if score > best_score then
                best_score = score
                best_action = action
                best_name = item.guardrail_name or best_name
              end

              if item.guardrail_name then
                table.insert(reasons, item.guardrail_name)
              end
            end

            result.block = best_action == "block"
            result.masked = best_action == "redact" or best_action == "modify"
            result.block_reason = best_action
            result.block_detail = table.concat(reasons, ", ")

            if result.block then
              result.block_message = best_name .. " blocked the request"
            elseif result.masked then
              result.block_message = best_name .. " requested masking"
            else
              result.block_message = best_name .. " raised an alert"
            end

            return result
          end

  - name: ai-custom-guardrail
    service: example-ai-service
    config:
      guarding_mode: OUTPUT
      text_source: concatenate_all_content
