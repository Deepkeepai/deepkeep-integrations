_format_version: "3.0"

plugins:
  - name: ai-custom-guardrail
    service: example-ai-service
    config:
      guarding_mode: INPUT
      text_source: concatenate_user_content
      allow_masking: false
      params:
        api_base: ${{ env "DECK_DEEPKEEP_API_BASE" }}
        api_key: ${{ env "DECK_DEEPKEEP_API_KEY" }}
        firewall_id: ${{ env "DECK_DEEPKEEP_INPUT_FIREWALL_ID" }}
        chat_id: ${{ env "DECK_DEEPKEEP_CHAT_ID" }}
        title: ${{ env "DECK_DEEPKEEP_TITLE" }}
      request:
        url: "$(conf.params.api_base)/api/v3/openai/moderations/pre"
        headers:
          X-API-Key: "$(conf.params.api_key)"
        body:
          model: "$(conf.params.firewall_id)"
          input: "$(content)"
          chat: "$(conf.params.chat_id)"
          title: "$(conf.params.title)"
      response:
        block: "$(deepkeep_check.block)"
        block_message: "$(deepkeep_check.block_message)"
      metrics:
        block_reason: "$(deepkeep_check.block_reason)"
        block_detail: "$(deepkeep_check.block_detail)"
        masked: "$(deepkeep_check.masked)"
      functions:
        deepkeep_check: |
          return function(resp)
            local result = {
              block = true,
              block_message = "DeepKeep blocked the request",
              masked = false,
              block_reason = "invalid_response",
              block_detail = "",
            }

            if type(resp) ~= "table" or type(resp.flagged) ~= "boolean" then
              return result
            end
            if resp.flagged == false then
              result.block = false
              result.block_message = "DeepKeep allowed the request"
              result.block_reason = ""
              return result
            end
            if type(resp.verbosity) ~= "table" then
              return result
            end

            -- Require a nonempty, dense array so malformed entries cannot be skipped.
            local count = 0
            for key in pairs(resp.verbosity) do
              if type(key) ~= "number" or key < 1 or key % 1 ~= 0 then
                return result
              end
              count = count + 1
            end
            if count == 0 then
              return result
            end

            local priority = { block = 4, redact = 3, modify = 2, alert = 1 }
            local best_action = "alert"
            local best_score = 1
            local reasons = {}
            for index = 1, count do
              local item = resp.verbosity[index]
              if type(item) ~= "table" or type(item.details) ~= "table" then
                return result
              end
              local action = item.details.guardrail_action
              if type(action) ~= "string" or not priority[action] then
                action = "invalid_action"
              end
              local score = priority[action] or 5
              if score > best_score then
                best_score = score
                best_action = action
              end
              if type(item.guardrail_name) == "string" then
                table.insert(reasons, item.guardrail_name)
              end
            end

            -- No replacement content is supplied; only explicit alerts may pass.
            result.block = best_action ~= "alert"
            result.block_reason = best_action
            result.block_detail = table.concat(reasons, ", ")
            if not result.block then
              result.block_message = "DeepKeep raised an alert"
            end
            return result
          end

  - name: ai-custom-guardrail
    service: example-ai-service
    config:
      guarding_mode: OUTPUT
      text_source: concatenate_all_content
      allow_masking: false
      params:
        api_base: ${{ env "DECK_DEEPKEEP_API_BASE" }}
        api_key: ${{ env "DECK_DEEPKEEP_API_KEY" }}
        firewall_id: ${{ env "DECK_DEEPKEEP_OUTPUT_FIREWALL_ID" }}
        chat_id: ${{ env "DECK_DEEPKEEP_CHAT_ID" }}
        title: ${{ env "DECK_DEEPKEEP_TITLE" }}
      request:
        url: "$(conf.params.api_base)/api/v3/openai/moderations/post"
