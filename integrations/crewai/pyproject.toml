[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crewai-tools-deepkeep"
version = "0.1.3"
description = "DeepKeep AI Firewall guardrails and hooks for CrewAI"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
authors = [
    {name = "DeepKeep", email = "info@deepkeep.ai"}
]
keywords = ["deepkeep", "crewai", "guardrails", "hooks", "ai-firewall", "moderation"]
dependencies = [
    "crewai>=1.15.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://deepkeep.ai"
Repository = "https://github.com/Deepkeepai/deepkeep-integrations/tree/main/integrations/crewai"
Documentation = "https://github.com/Deepkeepai/deepkeep-integrations/tree/main/integrations/crewai#readme"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
include = ["crewai_deepkeep*"]
