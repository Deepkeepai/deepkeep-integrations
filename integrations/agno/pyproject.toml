[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agno-deepkeep"
version = "0.1.1"
description = "DeepKeep AI Firewall guardrail integration for Agno"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "DeepKeep", email = "info@deepkeep.ai"}
]
keywords = ["deepkeep", "agno", "guardrails", "moderation", "ai-firewall"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "agno>=2.1.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://deepkeep.ai"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
include = ["agno_deepkeep*"]
