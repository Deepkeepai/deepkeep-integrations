name: Release Integration

on:
  workflow_dispatch:
    inputs:
      integration:
        description: Integration to release after publisher cutover
        type: choice
        options: [n8n, agentgateway, strands, agno, crewai, pydantic-ai]
        required: true
      tag:
        description: Existing monorepo tag, integration/vMAJOR.MINOR.PATCH
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.integration }}
  cancel-in-progress: false

jobs:
  validate:
    if: vars.MONOREPO_PUBLISHING_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require a monorepo tag reachable from main
        id: version
        env:
          INTEGRATION: ${{ inputs.integration }}
          TAG: ${{ inputs.tag }}
        run: |
          git check-ref-format "refs/tags/$TAG"
          commit=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$commit" origin/main
          git checkout --detach "$commit"
          version=$(python scripts/validate_release.py "$INTEGRATION" "$TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  python:
    needs: validate
    if: inputs.integration != 'n8n' && inputs.integration != 'agentgateway'
    runs-on: ubuntu-latest
    environment: release-${{ inputs.integration }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: integrations/${{ inputs.integration }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build twine
      - run: python -m pytest
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: integrations/${{ inputs.integration }}/dist/

  n8n:
    needs: validate
    if: inputs.integration == 'n8n'
    runs-on: ubuntu-latest
    environment: release-n8n
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: integrations/n8n
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm publish --provenance --access public

  container:
    needs: validate
    if: inputs.integration == 'agentgateway'
    runs-on: ubuntu-latest
    environment: release-agentgateway
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: integrations/agentgateway
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check unused version and capture current latest
        id: preflight
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: python ../../scripts/check_container_release.py "$VERSION" >> "$GITHUB_OUTPUT"
      - name: Record previous latest digest
        env:
          PREVIOUS_DIGEST: ${{ steps.preflight.outputs.previous_digest }}
        run: |
          printf 'Previous Agentgateway latest: %s\n' "$PREVIOUS_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: integrations/agentgateway
          file: integrations/agentgateway/Dockerfile
          push: true
          tags: |
            ghcr.io/deepkeepai/agentgateway-deepkeep-webhook:${{ needs.validate.outputs.version }}
            ghcr.io/deepkeepai/agentgateway-deepkeep-webhook:latest
      - name: Verify published version and latest
        id: postflight
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
        run: python ../../scripts/check_container_release.py "$VERSION" --expected-digest "$EXPECTED_DIGEST" >> "$GITHUB_OUTPUT"
      - name: Record published image digest
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          PUBLISHED_DIGEST: ${{ steps.postflight.outputs.published_digest }}
        run: |
          printf 'Published Agentgateway %s: %s\n' "$VERSION" "$PUBLISHED_DIGEST" >> "$GITHUB_STEP_SUMMARY"
